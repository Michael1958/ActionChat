  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); background: #e3a9b3;
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; display: block; }
  .credit { color: var(--muted); font-size: 11.5px; text-align: center; }
  .credit b { color: var(--text); font-weight: 600; }

  /* Sunset scene: pure CSS, no image files */
  #scene { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 80% 63%, rgba(255,252,228,1) 0, rgba(255,236,190,.9) 1.6%, rgba(255,205,150,.45) 6%, rgba(255,190,140,0) 20%),
      radial-gradient(ellipse 2.2% 16% at 80% 84%, rgba(255,214,160,.75), rgba(255,214,160,0)),
      linear-gradient(180deg, #8f96c9 0%, #ab9dc8 18%, #d2a5bd 36%, #f1b4a4 52%, #f7b98f 62%, #f1a57d 68.5%, #a690b0 70%, #8b84ab 80%, #6e7299 100%); }
  #scene::before { content: ""; position: absolute; left: 0; right: 0; bottom: 30%; height: 13%; background: #9c86a8; opacity: .55;
    clip-path: polygon(0 100%, 0 62%, 7% 40%, 13% 58%, 22% 22%, 30% 52%, 38% 34%, 46% 62%, 55% 28%, 63% 56%, 71% 38%, 80% 66%, 88% 44%, 95% 58%, 100% 40%, 100% 100%); }
  #scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 28.5%; height: 6%; background: #5f5a80; opacity: .55;
    clip-path: polygon(0 100%, 0 70%, 6% 50%, 12% 72%, 16% 100%, 70% 100%, 76% 66%, 84% 40%, 92% 62%, 100% 55%, 100% 100%); }

  /* ---------- Join screen ---------- */
  #join { position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .card { width: 100%; max-width: 390px; background: rgba(255,255,255,.80); border: 1px solid var(--glassLine);
    border-radius: 18px; padding: 24px 22px 16px; text-align: center; box-shadow: 0 16px 50px rgba(60,40,80,.25);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .card > img { width: 96px; height: 96px; }
  .card h1 { margin: 6px 0 4px; font-size: 25px; letter-spacing: .3px; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .field { width: 100%; padding: 11px 13px; margin-bottom: 10px; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .av-label { text-align: left; font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
  #avPick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; max-height: 172px; overflow-y: auto; padding: 2px; }
  #avPick button { height: 38px; border-radius: 10px; font-size: 20px; background: #fff; border: 1px solid var(--line); }
  #avPick button:hover { border-color: #c9bfd3; }
  #avPick button.sel { border: 2px solid var(--gold); background: #fff4d1; }
  #avPick .letter { font-size: 13px; font-weight: 700; color: var(--muted); }
  .btn { width: 100%; padding: 11px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 4px 14px rgba(37,99,235,.3); }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { opacity: .6; cursor: default; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 8px 0 6px; }

  /* ---------- Chat layout ---------- */
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex: 0 0 auto; }
  header img { width: 46px; height: 46px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  header h2 { margin: 0; font-size: 22px; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 2px rgba(255,255,255,.5); }
  .spacer { flex: 1; }
  .online-pill { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.45); }
  .online-pill:hover { background: rgba(255,255,255,.7); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  .sep { width: 1px; height: 24px; background: rgba(31,35,51,.18); }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #343a52; }
  .icon-btn:hover { background: rgba(255,255,255,.55); }
  .icon-btn.on { color: var(--accent); background: rgba(255,255,255,.55); }

  #searchBar { padding: 0 16px 8px; }
  #searchBar input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  #status { margin: 0 16px 8px; padding: 6px 14px; font-size: 13px; text-align: center; background: #fff3d6; color: #7a5600; border-radius: 10px; }

  .body { flex: 1; display: flex; gap: 12px; min-height: 0; padding: 0 12px 12px; position: relative; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden;
    background: var(--glass); border: 1px solid var(--glassLine); border-radius: 18px;
    box-shadow: 0 10px 40px rgba(70,40,90,.15); }
  #messages { flex: 1; overflow-y: auto; padding: 14px 8px 8px 14px;
    background: var(--wm) no-repeat 62% 46% / min(44%, 380px) auto; }
  .notice { text-align: center; color: var(--muted); font-size: 12.5px; margin: 2px auto 12px; padding: 4px 12px;
    background: rgba(255,255,255,.5); border-radius: 12px; width: fit-content; max-width: 100%; }

  /* ---------- Top cards: pin, poll, trivia ---------- */
  #topCards { flex: 0 0 auto; max-height: 38%; overflow-y: auto; padding: 10px 14px 0; display: flex; flex-direction: column; gap: 8px; }
  #topCards:empty { display: none; }
  .tc { background: var(--card); border: 1px solid rgba(255,255,255,.9); border-left-width: 4px; border-radius: 12px; padding: 9px 12px;
    box-shadow: 0 4px 16px rgba(70,40,90,.10); }
  .tc.pin { border-left-color: var(--gold); }
  .tc.trivia { border-left-color: #8b5cf6; }
  .tc.poll { border-left-color: var(--accent); }
  .tc-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .tc-head .tt { font-weight: 700; color: var(--text); letter-spacing: .2px; }
  .tc-head .grow { flex: 1; }
  .tc-head button { font-size: 12px; padding: 3px 9px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); }
  .tc-head button:hover { border-color: var(--accent); }
  .tc-head .x { border: 0; background: none; color: var(--muted); padding: 2px 6px; font-size: 15px; }
  .tc-q { margin-top: 5px; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .tc.collapsed .tc-body { display: none; }
  .pin-text { margin-top: 4px; overflow-wrap: anywhere; }
  .count { margin-top: 4px; color: #a16207; font-weight: 700; font-variant-numeric: tabular-nums; }
  .opts { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
  .opt { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; padding: 6px 10px; background: #fff; display: flex; gap: 8px; }
  .opt:hover { border-color: var(--accent); }
  .opt.mine { border-color: var(--accent); }
  .opt .bar { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(37,99,235,.12); transition: width .4s; }
  .opt.mine .bar { background: rgba(37,99,235,.24); }
  .opt span { position: relative; }
  .opt .lbl { flex: 1; overflow-wrap: anywhere; }
  .opt .pct { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .opt:disabled { cursor: default; }
  .tv-status { margin-top: 5px; font-size: 13.5px; color: #6d28d9; }
  .tv-status.win { color: var(--green); font-weight: 600; }
  .scores { margin-top: 5px; font-size: 12.5px; color: var(--muted); }

  /* ---------- Messages ---------- */
  .msg { display: flex; gap: 12px; padding: 5px 8px; border-radius: 12px; position: relative; }
  .msg:hover, .msg.sel { background: rgba(255,255,255,.22); }
  .msg.mentioned { background: rgba(255,214,90,.22); box-shadow: inset 3px 0 0 var(--gold); }
  .msg.flash { animation: flash 1.2s; }
  @keyframes flash { 0%,60% { background: rgba(37,99,235,.20); } 100% { background: transparent; } }
  .avatar { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 600; color: #fff; font-size: 16px; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(60,40,80,.18); }
  .avatar.emoji { font-size: 22px; }
  .avatar.admin { background: #1a1608 !important; border-color: var(--gold); overflow: hidden; }
  .avatar.admin img { width: 32px; height: 32px; }
  .meta { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 700; font-size: 14.5px; text-shadow: 0 1px 2px rgba(255,255,255,.55); }
  .name.admin { color: var(--goldText); }
  .badge { font-size: 10.5px; font-weight: 800; color: #1a1608; background: #f5c518; padding: 1px 7px; border-radius: 5px; letter-spacing: .3px; }
  .time { color: #4a5068; font-size: 12px; text-shadow: 0 1px 2px rgba(255,255,255,.55); }
  .content { min-width: 0; flex: 1; }
  .msg:not(.action) .content { display: flex; flex-direction: column; align-items: flex-start; }
  .text { display: inline-block; max-width: min(100%, 680px); margin-top: 2px; padding: 6px 12px; border-radius: 4px 14px 14px 14px;
    background: rgba(255,255,255,.86); box-shadow: 0 2px 8px rgba(70,40,90,.10);
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .text pre { margin: 6px 0; padding: 10px 12px; background: var(--code); border-radius: 8px; overflow-x: auto; max-width: 560px; }
  .text code { font: 13px/1.5 Consolas, "Cascadia Code", Menlo, monospace; color: #9ecbff; white-space: pre; }
  .mention { color: var(--accent2); font-weight: 600; }
  .mention.me { color: #1a1608; background: #f5c518; border-radius: 4px; padding: 0 3px; }
  .quote { margin: 3px 0 2px; padding: 3px 10px; border-left: 3px solid #8b93b8; background: rgba(255,255,255,.6); border-radius: 0 8px 8px 0;

<div id="scene"></div>

<!-- ===== Join screen ===== -->
<div id="join">
  <form class="card" id="joinForm" autocomplete="off">
    <img src="/logo.png" alt="Action Chat logo">
    <h1>Action Chat</h1>
    <p>Pick a name to join. No sign-up needed.<br>Messages are not saved.</p>
    <input class="field" id="nameInput" maxlength="20" placeholder="Your name" required>
    <input class="field hidden" id="pwInput" type="password" placeholder="Admin password" autocomplete="current-password">
    <div class="av-label">Choose your avatar</div>
    <div id="avPick"></div>
    <button class="btn" id="joinBtn" type="submit">Join chat</button>
    <div class="err" id="joinErr"></div>
    <div class="credit" id="joinCredit"></div>
  </form>
</div>

<!-- ===== Chat ===== -->
<div id="app" class="hidden">

    <h2>Action Chat</h2>

  </header>

      </div>
      <button id="newMsgs" class="hidden">New messages ↓</button>

      <form class="composer" id="composer">

      <div id="gifPop" class="pop hidden">

    </div>

  </div>

  <div id="menu" class="pop hidden"></div>
</div>

<div id="overlay" class="overlay hidden"><div class="dialog" id="dialog"></div></div>

      buttons(d, "Block", function () { send({ type: "block", userId: user.id, purge: purge.checked, byNetwork: net.checked }); });
    });
  }
  function pollDialog() {
    openDialog(function (d) {
      d.appendChild(el("h4", null, "📊 Start a poll"));
      if (poll) d.appendChild(el("div", "hint", "This replaces the current poll."));
      var q = field(d, "Question", "e.g. Which movie should we watch?", 200);
      d.appendChild(el("span", "lab", "Options (2 to 6)"));
      var list = el("div"); d.appendChild(list);
      function addOpt() { if (list.children.length >= 6) return; var f = el("input", "field"); f.maxLength = 80; f.placeholder = "Option " + (list.children.length + 1); list.appendChild(f); f.focus(); }
      addOpt(); addOpt(); q.focus();
      var more = el("button", "linkbtn", "+ Add option"); more.type = "button"; more.onclick = addOpt; d.appendChild(more);
      buttons(d, "Start poll", function () {
        var opts = Array.prototype.map.call(list.children, function (f) { return f.value.trim(); }).filter(Boolean);
        if (!q.value.trim() || opts.length < 2) { toast("Add a question and at least 2 options.", true); return false; }
        send({ type: "pollStart", q: q.value.trim(), options: opts });
      }, "btn-blue");
    });
  }
  var lastBank = -1;
  function triviaDialog() {
    openDialog(function (d) {
      d.appendChild(el("h4", null, trivia ? "🧠 Next trivia question" : "🧠 Start trivia"));
      d.appendChild(el("div", "hint", "Players type answers in the chat. The first correct answer scores a point. Scores carry on until you end the game."));
      var q = field(d, "Question", "e.g. What is the capital of France?", 300);
      var a = field(d, "Correct answer", "e.g. Paris", 200);
      d.appendChild(el("div", "hint", "More than one accepted answer? Separate them with | (for example: 7|seven). Capitals, accents and one small typo are ignored."));
      var rnd = el("button", "linkbtn", "🎲 Use a random question"); rnd.type = "button";
      rnd.onclick = function () {
        var i; do { i = Math.floor(Math.random() * TRIVIA_BANK.length); } while (i === lastBank && TRIVIA_BANK.length > 1);
        lastBank = i; q.value = TRIVIA_BANK[i][0]; a.value = TRIVIA_BANK[i][1];
      };
      d.appendChild(rnd);
      buttons(d, "Ask question", function () {
        if (!q.value.trim() || !a.value.trim()) { toast("Add a question and the correct answer.", true); return false; }
        send({ type: "triviaStart", q: q.value.trim(), a: a.value.trim() });
      }, "btn-blue");
    });
  }
  function pinDialog(text) {
    openDialog(function (d) {
      d.appendChild(el("h4", null, "📌 Pin announcement"));
      if (pin) d.appendChild(el("div", "hint", "This replaces the current announcement."));
      var t = field(d, "Announcement", "e.g. Live show starts at 21:00!", 200); t.value = text || "";
      var when = field(d, "Countdown to (optional, up to 1 year ahead)", "", 0, "datetime-local");
      buttons(d, "Pin", function () {
        if (!t.value.trim()) { toast("Write the announcement first.", true); return false; }
        var until = when.value ? new Date(when.value).getTime() : 0;
        if (until && until < Date.now()) { toast("Pick a time in the future.", true); return false; }
        if (until && until > Date.now() + 365 * 86400000) { toast("The countdown can be up to 1 year ahead.", true); return false; }
        send({ type: "pin", text: t.value.trim(), until: until });
      }, "btn-blue");
    });
  }
  function showHelp() {
    openDialog(function (d) {
      d.appendChild(el("h4", null, "❓ Commands and tips"));
      var ul = el("ul", "help-list");
      [["/roll", " roll a dice. Try /roll 20 or /roll 2d6"], ["/flip", " flip a coin"], ["/8ball question", " ask the magic 8-ball"],
       ["/me waves", " show an action, like ✨ Alex waves"], ["@name", " mention someone. They get a sound and a highlight"]]
        .forEach(function (x) { var li = el("li"); li.appendChild(el("code", null, x[0])); li.appendChild(document.createTextNode(x[1])); ul.appendChild(li); });
      ["Hover over a message (or tap it on a phone) to react 👍 or reply ↩.",
       "Words like \"congrats\" or \"happy birthday\" and 🎉 make confetti rain for everyone.",
       "Choose your avatar on the join screen. Turn sounds on or off in the ⋮ menu."]
        .forEach(function (t) { ul.appendChild(el("li", null, t)); });
      d.appendChild(ul);
      var row = el("div", "row"); var c = el("button", "btn-blue", "Got it"); c.type = "button"; c.onclick = closeDialog; row.appendChild(c); d.appendChild(row);
      var cr = el("div", "credit", credit); cr.style.marginTop = "12px"; cr.appendChild(el("b", null, DEVELOPER)); d.appendChild(cr);
    });
  }
  function showBlockedList(list) {
    openDialog(function (d) {
      d.appendChild(el("h4", null, "Blocked users (" + list.length + ")"));
      var wrap = el("div", "blist");
      if (!list.length) wrap.appendChild(el("div", "sys", "Nobody is blocked."));
      list.slice().reverse().forEach(function (b) {
        var r = el("div", "bitem"); var info = el("div", null, b.name);
        info.appendChild(el("small", null, new Date(b.at).toLocaleString() + (b.network ? " · device + network" : " · device")));
        var u = el("button", "btn2", "Unblock"); u.onclick = function () { send({ type: "unblock", bid: b.bid }); };
        r.appendChild(info); r.appendChild(u); wrap.appendChild(r);
      });
      d.appendChild(wrap);
      var row = el("div", "row"); var c = el("button", "btn2", "Close"); c.onclick = closeDialog; row.appendChild(c); d.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
